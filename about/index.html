<script src="/assets/js/marked.min.js"></script>
<script src="/assets/js/blog.js"></script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
    BlogNav.init();
    BlogBackToTop.init();

    // Load and render about content
    fetch('/about/content.md')
        .then(function (res) {
            if (!res.ok) throw new Error('Failed to load content');
            return res.text();
        })
        .then(function (markdown) {
            marked.setOptions({ breaks: true, gfm: true });
            // 安全渲染：禁用原始 HTML，链接/图片仅允许 http(s)/mailto/#/相对路径
            const renderer = new marked.Renderer();
            const safeProtocol = function (value) {
                if (!value) return true;
                const v = String(value).trim().toLowerCase();
                return /^(https?:|mailto:|#|\/|\.\.?\/)/.test(v) && !/javascript:|data:/i.test(v);
            };
            renderer.html = function () { return ''; };
            const origLink = renderer.link.bind(renderer);
            const origImage = renderer.image.bind(renderer);
            renderer.link = function (href, title, text) {
                return safeProtocol(href) ? origLink(href, title, text) : text;
            };
            renderer.image = function (href, title, text) {
                return safeProtocol(href) ? origImage(href, title, text) : '';
            };
            marked.use({ renderer: renderer });
            const aboutContent = document.getElementById('about-content');
            aboutContent.innerHTML = marked.parse(markdown);
            // 懒加载图片
            aboutContent.querySelectorAll('img').forEach(function (img) {
                img.loading = 'lazy';
            });
        })
        .catch(function (err) {
            document.getElementById('about-content').innerHTML = '<p class="blog-error">内容加载失败</p>';
            console.error('About page error:', err);
        });
</script>
