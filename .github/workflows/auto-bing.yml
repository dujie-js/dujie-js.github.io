name: Auto Update Bing Images CI

concurrency:
  group: auto-bing
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [ main ]
    paths:
      - 'assets/js/bing.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate images.json
        run: |
          node assets/js/bing.js

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'assets/json/images.json'
          message: "[bot] update images.json"
          github_token: ${{ secrets.GITHUB_TOKEN }}
